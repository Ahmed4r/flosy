workflows:
  ios-ipa-build:
    name: 🎉 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_ENV: $API_ENV

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache

    scripts:

      # ==========================================
      # 1. Clean Flutter
      # ==========================================
      - name: Clean Flutter
        script: |
          set -e
          flutter clean

      # ==========================================
      # 2. Get Flutter dependencies
      # ==========================================
      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      # ==========================================
      # 3. Create api.env
      # ==========================================
      - name: Create api.env file
        script: |
          set -e

          echo "$API_ENV" > "$CM_BUILD_DIR/api.env"

          echo "✅ api.env created"
          echo "File exists:"
          ls -l "$CM_BUILD_DIR/api.env"

      # ==========================================
      # 4. Verify Firebase plugins
      # ==========================================
      - name: Verify Flutter plugins
        script: |
          set -e

          echo "=========================================="
          echo "Firebase in .flutter-plugins-dependencies"
          echo "=========================================="

          if [ -f .flutter-plugins-dependencies ]; then
            grep -i -C 3 -E \
              'firebase_core|firebase_auth|cloud_firestore' \
              .flutter-plugins-dependencies || true
          else
            echo "❌ .flutter-plugins-dependencies not found"
          fi

          echo ""
          echo "=========================================="
          echo "Firebase iOS symlinks"
          echo "=========================================="

          for plugin in firebase_core firebase_auth cloud_firestore; do
            if [ -e "ios/.symlinks/plugins/$plugin" ]; then
              echo "✅ $plugin exists"
              ls -la "ios/.symlinks/plugins/$plugin"
            else
              echo "❌ $plugin missing"
            fi
          done

      # ==========================================
      # 5. Generate Flutter iOS configuration
      # ==========================================
      - name: Generate Flutter iOS configuration
        script: |
          set -e

          flutter precache --ios

          flutter build ios \
            --config-only \
            --release \
            --no-codesign

          echo "✅ Flutter iOS configuration generated"

      # ==========================================
      # 6. Show xcconfig files
      # ==========================================
      - name: Verify xcconfig files
        script: |
          set -e

          echo "=========================================="
          echo "Release.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Release.xcconfig

          echo ""
          echo "=========================================="
          echo "Debug.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Debug.xcconfig || true

          echo ""
          echo "=========================================="
          echo "Profile.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Profile.xcconfig || true

      # ==========================================
      # 7. Install CocoaPods
      # ==========================================
      - name: Install CocoaPods
        script: |
          set -e

          cd ios

          echo "🧹 Removing old Pods..."
          rm -rf Pods
          rm -f Podfile.lock

          echo "🔧 Running pod deintegrate..."
          pod deintegrate || true

          echo "📦 Installing CocoaPods..."
          pod install --repo-update

          echo ""
          echo "=========================================="
          echo "Firebase pods"
          echo "=========================================="

          grep -i -E \
            "Firebase|Firestore|cloud_firestore|firebase_auth|firebase_core" \
            Podfile.lock || true

          if ! grep -qi "cloud_firestore" Podfile.lock; then
            echo "❌ cloud_firestore still missing from Podfile.lock"
            exit 1
          fi

          echo "✅ Firebase pods detected"

          cd ..
      # ==========================================
      # 8. Verify CocoaPods configuration
      # ==========================================
      - name: Verify CocoaPods configuration
        script: |
          set -e

          echo "=========================================="
          echo "Pods-Runner files"
          echo "=========================================="

          find "ios/Pods/Target Support Files/Pods-Runner" \
            -maxdepth 1 \
            -type f \
            -print || true

          echo ""
          echo "=========================================="
          echo "Release Pods xcconfig"
          echo "=========================================="

          cat \
            "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" \
            || true

          echo ""
          echo "=========================================="
          echo "Checking Firebase headers"
          echo "=========================================="

          find ios/Pods \
            -iname "*Firebase*" \
            -o -iname "*Firestore*" \
            | head -100 || true

      # ==========================================
      # 9. Disable Code Signing
      # ==========================================
      - name: Disable Code Signing
        script: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT"

          sed -i '' \
            's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            "$PROJECT"

          echo "✅ Code signing disabled"

      # ==========================================
      # 10. Build with Xcode
      # ==========================================
      - name: Build with xcodebuild
        script: |
          set -e

          cd ios

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/derived" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          cd ..

          echo "✅ Xcode build completed successfully"

      # ==========================================
      # 11. Create unsigned IPA
      # ==========================================
      - name: Create IPA
        script: |
          set -e

          APP_PATH=$(find "$CM_BUILD_DIR/derived" \
            -name "Runner.app" \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Runner.app not found"
            exit 1
          fi

          echo "Found app at:"
          echo "$APP_PATH"

          rm -rf build/ios/iphoneos/Payload

          mkdir -p build/ios/iphoneos/Payload

          cp -R "$APP_PATH" \
            build/ios/iphoneos/Payload/Runner.app

          cd build/ios/iphoneos

          zip -qq -r -9 \
            FlutterIpaExport.ipa \
            Payload

          echo ""
          echo "=========================================="
          echo "IPA created"
          echo "=========================================="

          ls -lh FlutterIpaExport.ipa

    artifacts:
      - build/ios/iphoneos/FlutterIpaExport.ipa