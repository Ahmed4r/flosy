workflows:
  ios-ipa-build:
    name: 🎉 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_ENV: $API_ENV

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache

    scripts:

      # ---------------------------------------------------------
      # 1. Flutter dependencies
      # ---------------------------------------------------------
      - name: Get Flutter packages
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          flutter clean
          flutter pub get

          echo "✅ flutter pub get completed"

      # ---------------------------------------------------------
      # 2. Create api.env
      # ---------------------------------------------------------
      - name: Create api.env
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          printf '%s\n' "$API_ENV" > api.env

          echo "✅ api.env created"

      # ---------------------------------------------------------
      # 3. Verify Flutter plugins
      # ---------------------------------------------------------
      - name: Verify Flutter plugins
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "=============================="
          echo "Flutter plugins"
          echo "=============================="

          flutter pub deps --style=compact | grep -E \
            "firebase_core|firebase_auth|cloud_firestore|audio_waveforms|audioplayers" \
            || true

          echo ""
          echo "=============================="
          echo "GeneratedPluginRegistrant"
          echo "=============================="

          grep -E \
            "cloud_firestore|firebase_auth|firebase_core" \
            ios/Runner/GeneratedPluginRegistrant.m \
            || true

      # ---------------------------------------------------------
      # 4. Generate iOS Flutter configuration
      # ---------------------------------------------------------
      - name: Generate iOS configuration
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          flutter precache --ios

          flutter build ios \
            --config-only \
            --release \
            --no-codesign

          echo "✅ iOS Flutter configuration generated"

      # ---------------------------------------------------------
      # 5. CocoaPods
      # ---------------------------------------------------------
      - name: Install CocoaPods
        script: |
          set -e

          cd "$CM_BUILD_DIR/ios"

          echo "🧹 Removing old Pods..."
          rm -rf Pods

          echo "🧹 Removing old Podfile.lock..."
          rm -f Podfile.lock

          echo "🔧 Installing Pods..."
          pod install --repo-update

          echo ""
          echo "=============================="
          echo "Pod installation result"
          echo "=============================="

          echo "Installed pods:"
          find Pods -maxdepth 1 -type d -print

          echo ""
          echo "Firebase entries in Podfile.lock:"
          grep -i -E \
            "Firebase|Firestore|cloud_firestore|firebase_auth|firebase_core" \
            Podfile.lock \
            || true

          echo ""
          echo "Checking Firebase pod targets..."

          if grep -qi "cloud_firestore" Podfile.lock; then
            echo "✅ cloud_firestore found in Podfile.lock"
          else
            echo "❌ cloud_firestore NOT found in Podfile.lock"
            exit 1
          fi

          if grep -qi "firebase_core" Podfile.lock; then
            echo "✅ firebase_core found in Podfile.lock"
          else
            echo "❌ firebase_core NOT found in Podfile.lock"
            exit 1
          fi

          echo "✅ CocoaPods integration verified"

      # ---------------------------------------------------------
      # 6. Check CocoaPods xcconfig
      # ---------------------------------------------------------
      - name: Verify CocoaPods configuration
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "=============================="
          echo "Pods Runner configuration"
          echo "=============================="

          find ios/Pods/Target\ Support\ Files/Pods-Runner \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "=============================="
          echo "Flutter Release.xcconfig"
          echo "=============================="

          cat ios/Flutter/Release.xcconfig

      # ---------------------------------------------------------
      # 7. Disable code signing
      # ---------------------------------------------------------
      - name: Disable code signing
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          PROJECT_FILE="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' \
            "$PROJECT_FILE"

          sed -i '' \
            's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            "$PROJECT_FILE"

          echo "✅ Code signing disabled"

      # ---------------------------------------------------------
      # 8. Xcode build
      # ---------------------------------------------------------
      - name: Build with Xcode
        script: |
          set -e

          cd "$CM_BUILD_DIR/ios"

          rm -rf "$CM_BUILD_DIR/derived"

          echo "🚀 Building Runner.xcworkspace..."

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/derived" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

          echo "✅ Xcode build completed"

      # ---------------------------------------------------------
      # 9. Create IPA
      # ---------------------------------------------------------
      - name: Create unsigned IPA
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/derived/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app not found"
            echo ""
            echo "Searching..."
            find "$CM_BUILD_DIR/derived" \
              -name "Runner.app" \
              -type d \
              -print
            exit 1
          fi

          echo "✅ Found:"
          echo "$APP_PATH"

          IPA_DIR="$CM_BUILD_DIR/build/ios/iphoneos"

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          cp -R "$APP_PATH" "$IPA_DIR/Payload/"

          cd "$IPA_DIR"

          zip -qq -r -9 \
            FlutterIpaExport.ipa \
            Payload

          echo ""
          echo "================================"
          echo "IPA CREATED"
          echo "================================"

          ls -lh FlutterIpaExport.ipa

    artifacts:
      - build/ios/iphoneos/FlutterIpaExport.ipa