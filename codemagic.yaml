workflows:
  ios-ipa-build:
    name: 🎉 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - ios/Pods
    scripts:
      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      - name: Set iOS deployment target
        script: |
          set -e
          cd ios
          DEPLOYMENT_TARGET="platform :ios, '15.0'"
          if ! grep -q "platform :ios" Podfile; then
            sed -i '' "1i\\
          $DEPLOYMENT_TARGET
          " Podfile
          fi
          cd ..

      - name: Clean and update CocoaPods
        script: |
          set -e
          cd ios
          rm -f Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..

      - name: Build iOS App
        script: |
          set -e
          flutter build ios --release --no-codesign

      - name: Create IPA
        script: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -q -r FlutterApp.ipa Payload
          ls -lh FlutterApp.ipa

    artifacts:
      - build/ios/iphoneos/FlutterApp.ipa