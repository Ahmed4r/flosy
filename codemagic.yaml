workflows:
  ios-ipa-build:
    name: iOS IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest

      vars:
        API_ENV: $API_ENV

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache

    scripts:

      # ==========================================
      # 1. Clean
      # ==========================================
      - name: Flutter clean
        script: |
          set -e

          flutter clean

      # ==========================================
      # 2. Pub get
      # ==========================================
      - name: Flutter pub get
        script: |
          set -e

          flutter pub get

      # ==========================================
      # 3. Create api.env
      # ==========================================
      - name: Create api.env
        script: |
          set -e

          echo "$API_ENV" > "$CM_BUILD_DIR/api.env"

          echo "✅ api.env created"

      # ==========================================
      # 4. Verify Flutter / SwiftPM
      # ==========================================
      - name: Verify Flutter configuration
        script: |
          set -e

          echo "=========================================="
          echo "Flutter version"
          echo "=========================================="

          flutter --version

          echo ""
          echo "=========================================="
          echo "Swift Package Manager configuration"
          echo "=========================================="

          grep -o \
            '"swift_package_manager_enabled"[^}]*}' \
            .flutter-plugins-dependencies || true

          echo ""
          echo "=========================================="
          echo "Firebase plugins"
          echo "=========================================="

          grep -i -E \
            'cloud_firestore|firebase_auth|firebase_core' \
            .flutter-plugins-dependencies || true

      # ==========================================
      # 5. Generate iOS project
      # ==========================================
      - name: Generate iOS project
        script: |
          set -e

          flutter precache --ios

          flutter build ios \
            --config-only \
            --release \
            --no-codesign

          echo "✅ iOS project generated"

      # ==========================================
      # 6. Verify Swift Package integration
      # ==========================================
      - name: Verify Swift Package integration
        script: |
          set -e

          echo "=========================================="
          echo "Flutter iOS Swift Packages"
          echo "=========================================="

          find ios -maxdepth 4 \
            \( -name "*.swift" -o -name "Package.swift" \) \
            -print | head -100 || true

          echo ""
          echo "=========================================="
          echo "Runner project references"
          echo "=========================================="

          grep -R -i \
            "FlutterGeneratedPluginSwiftPackage" \
            ios/Runner.xcodeproj \
            ios/Runner.xcworkspace \
            2>/dev/null || true

      # ==========================================
      # 7. Disable Code Signing
      # ==========================================
      - name: Disable Code Signing
        script: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT"

          sed -i '' \
            's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            "$PROJECT"

          echo "✅ Code signing disabled"

      # ==========================================
      # 8. Build iOS
      # ==========================================
      - name: Build Flutter iOS
        script: |
          set -e

          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

          echo "✅ Flutter iOS build completed"

      # ==========================================
      # 9. Create IPA
      # ==========================================
      - name: Create IPA
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app not found"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/ios/iphoneos/Payload"

          mkdir -p \
            "$CM_BUILD_DIR/build/ios/iphoneos/Payload"

          cp -R \
            "$APP_PATH" \
            "$CM_BUILD_DIR/build/ios/iphoneos/Payload/Runner.app"

          cd "$CM_BUILD_DIR/build/ios/iphoneos"

          zip -qq -r -9 \
            FlutterIpaExport.ipa \
            Payload

          echo ""
          echo "=========================================="
          echo "IPA created"
          echo "=========================================="

          ls -lh FlutterIpaExport.ipa

    artifacts:
      - build/ios/iphoneos/FlutterIpaExport.ipa