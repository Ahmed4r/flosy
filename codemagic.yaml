workflows:
  ios-ipa-build:
    name: 🎉 iOS Build (FIXED v2)
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_ENV: $API_ENV
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - ios/Pods
        - $HOME/.cocoapods
        - ios/.symlinks
        - $HOME/.dart

    scripts:
      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      - name: Create api.env file
        script: |
          set -e
          echo "$API_ENV" > "$CM_BUILD_DIR/api.env"
          echo "✅ api.env created"

      - name: 🎤 FORCE Add Microphone Permission
        script: |
          set -e
          
          PLIST_PATH="ios/Runner/Info.plist"
          
          echo "=========================================="
          echo "FORCING MICROPHONE PERMISSION"
          echo "=========================================="
          
          # Remove any existing (to avoid duplicates)
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$PLIST_PATH" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$PLIST_PATH" 2>/dev/null || true
          
          # Add permissions
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Flosy needs microphone access to record your voice for adding transactions by voice.'" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Flosy uses speech recognition to convert your voice recordings into transaction data.'" "$PLIST_PATH"
          
          # Verify
          MIC=$(/usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST_PATH" 2>&1)
          echo "Microphone permission added: $MIC"
          echo "=========================================="

      - name: Set iOS deployment target
        script: |
          set -e
          cd ios
          if ! grep -q "platform :ios, '16.0'" Podfile; then
            echo "platform :ios, '16.0'" | cat - Podfile > temp && mv temp Podfile
          fi
          cd ..

      - name: Install CocoaPods
        script: |
          set -e
          rm -f ios/Podfile.lock
          cd ios
          pod repo update
          pod deintegrate
          pod install
          cd ..

      - name: 🔍 Verify After CocoaPods
        script: |
          set -e
          PLIST_PATH="ios/Runner/Info.plist"
          
          echo "Checking if CocoaPods kept the permission..."
          
          if /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST_PATH" >/dev/null 2>&1; then
            MIC=$(/usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST_PATH")
            echo "✅ Still there: $MIC"
          else
            echo "❌ REMOVED! Re-adding..."
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Flosy needs microphone access to record your voice for adding transactions by voice.'" "$PLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Flosy uses speech recognition to convert your voice recordings into transaction data.'" "$PLIST_PATH"
          fi

      - name: Disable Code Signing
        script: |
          set -e
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' ios/Runner.xcodeproj/project.pbxproj
          echo "Code signing disabled"

      - name: Build with xcodebuild
        script: |
          set -e
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $CM_BUILD_DIR/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
          cd ..
          
          echo "Build completed successfully"

      - name: 🎯🎯🎯 CRITICAL - Verify Built App
        script: |
          set -ex  # -x for verbose output
          
          echo "=========================================="
          echo "VERIFYING BUILT APP INFO.PLIST"
          echo "=========================================="
          
          # Find the built app
          APP_PATH=$(find $CM_BUILD_DIR/derived -name "Runner.app" -type d | head -1)
          echo "App path: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find Runner.app!"
            exit 1
          fi
          
          APP_PLIST="$APP_PATH/Info.plist"
          echo "Plist path: $APP_PLIST"
          
          if [ ! -f "$APP_PLIST" ]; then
            echo "ERROR: Info.plist not found at $APP_PLIST"
            ls -la "$APP_PATH" || true
            exit 1
          fi
          
          echo ""
          echo "Checking for microphone permission in BUILT app..."
          
          # Try to get the microphone description
          set +e  # Don't exit on error for this check
          MIC_RESULT=$(/usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP_PLIST" 2>&1)
          MIC_EXIT=$?
          set -e
          
          echo "PlistBuddy exit code: $MIC_EXIT"
          echo "PlistBuddy output: $MIC_RESULT"
          
          if [ $MIC_EXIT -eq 0 ]; then
            echo ""
            echo "✅✅✅ SUCCESS ✅✅✅"
            echo "Microphone permission IS in built app:"
            echo "  '$MIC_RESULT'"
            echo ""
          else
            echo ""
            echo "❌❌❌ FAILURE ❌❌❌"
            echo "Microphone permission NOT in built app!"
            echo ""
            echo "Showing all keys in built Info.plist:"
            /usr/libexec/PlistBuddy -c "Print" "$APP_PLIST" 2>&1 | head -100
            echo ""
            echo "This IPA will NOT show microphone in iOS Settings!"
            exit 1
          fi
          
          echo "=========================================="

      - name: Create IPA
        script: |
          set -e
          APP_PATH=$(find $CM_BUILD_DIR/derived -name "Runner.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ios/iphoneos/Payload
          cp -r "$APP_PATH" build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qq -r -9 FlutterIpaExport.ipa Payload
          echo "IPA created: $(du -sh FlutterIpaExport.ipa | cut -f1)"

    artifacts:
      - build/ios/iphoneos/FlutterIpaExport.ipa