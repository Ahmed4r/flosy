workflows:
  ios-ipa-build:
    name: 🎉 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - ios/Pods
    scripts:
      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      - name: Disable Code Signing in project FIRST
        script: |
          set -e
          # Remove CODE_SIGN_STYLE = Automatic; lines
          sed -i '' '/CODE_SIGN_STYLE = Automatic;/d' ios/Runner.xcodeproj/project.pbxproj
          
          # Add CODE_SIGN_STYLE = Manual; to all buildSettings blocks
          sed -i '' '/buildSettings = {/a\
                          CODE_SIGN_STYLE = Manual;\
                          CODE_SIGNING_REQUIRED = NO;\
                          CODE_SIGNING_ALLOWED = NO;
          ' ios/Runner.xcodeproj/project.pbxproj
          
          echo "✅ Code signing disabled in project.pbxproj"

      - name: Generate iOS project files
        script: |
          set -e
          flutter build ios --config-only

      - name: Set iOS deployment target in Podfile
        script: |
          set -e
          cd ios
          # Prepend platform version to Podfile
          if ! grep -q "platform :ios, '15.0'" Podfile; then
            echo "platform :ios, '15.0'" | cat - Podfile > Podfile.tmp
            mv Podfile.tmp Podfile
          fi
          cd ..

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install
          cd ..

      - name: Re-apply code signing disable (in case Flutter reverted it)
        script: |
          set -e
          # Remove any CODE_SIGN_STYLE = Automatic; that might have reappeared
          sed -i '' '/CODE_SIGN_STYLE = Automatic;/d' ios/Runner.xcodeproj/project.pbxproj
          
          # Ensure all targets have code signing disabled
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          
          echo "✅ Code signing still disabled"

      - name: Build iOS (release, no signing)
        script: |
          set -e
          flutter build ios --release --no-codesign

      - name: Create IPA
        working_directory: build/ios/iphoneos
        script: |
          set -e
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
          ls -lh FlutterIpaExport.ipa

    artifacts:
      - build/ios/iphoneos/FlutterIpaExport.ipa