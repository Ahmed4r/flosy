workflows:
  ios-ipa-build:
    name: 🎉 iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - ios/Pods
    scripts:
      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      - name: Generate iOS project files
        script: |
          set -e
          flutter build ios --config-only

      - name: Set iOS deployment target in Podfile
        script: |
          set -e
          cd ios
          # Prepend platform version to Podfile
          if ! grep -q "platform :ios, '15.0'" Podfile; then
            echo "platform :ios, '15.0'" | cat - Podfile > Podfile.tmp
            mv Podfile.tmp Podfile
          fi
          cd ..

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install
          cd ..

      - name: Disable Code Signing for all targets
        script: |
          set -e
          # Set CODE_SIGN_STYLE to Manual for all build configurations
          sed -i '' '/CODE_SIGN_STYLE = Automatic;/d' ios/Runner.xcodeproj/project.pbxproj
          
          # Add CODE_SIGN_STYLE = Manual; and disable code signing for all targets
          sed -i '' '/buildSettings = {/a\
                          CODE_SIGN_STYLE = Manual;\
                          CODE_SIGNING_REQUIRED = NO;\
                          CODE_SIGNING_ALLOWED = NO;\
                          CODE_SIGN_IDENTITY = "";\
                          DEVELOPMENT_TEAM = "";
          ' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS (release, no signing)
        script: |
          set -e
          flutter build ios --release --no-codesign

      - name: Create IPA
        working_directory: build/ios/iphoneos
        script: |
          set -e
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
          ls -lh FlutterIpaExport.ipa

    artifacts:
      - build/ios/iphoneos/FlutterIpaExport.ipa