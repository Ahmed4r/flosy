name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install Flutter
      # ==========================================
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      # ==========================================
      # 3. Flutter doctor / version
      # ==========================================
      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      # ==========================================
      # 4. Clean
      # ==========================================
      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================
      # 5. Get dependencies
      # ==========================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================
      # 6. Verify Flutter plugin configuration
      # ==========================================
      - name: Verify Flutter iOS plugins
        run: |
          set -e

          echo "=========================================="
          echo "Flutter plugin configuration"
          echo "=========================================="

          if [ -f ".flutter-plugins-dependencies" ]; then
            grep -i -C 2 \
              -E 'firebase_core|firebase_auth|cloud_firestore' \
              .flutter-plugins-dependencies || true
          else
            echo "❌ .flutter-plugins-dependencies not found"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Swift Package Manager configuration"
          echo "=========================================="

          grep -o \
            '"swift_package_manager_enabled"[^}]*}' \
            .flutter-plugins-dependencies || true

      # ==========================================
      # 7. Remove stale generated iOS files
      # ==========================================
      - name: Clean stale iOS generated files
        run: |
          set -e

          echo "🧹 Removing stale Flutter iOS generated files..."

          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          echo "✅ Stale files removed"

      # ==========================================
      # 8. Generate Flutter iOS configuration
      # ==========================================
      - name: Generate iOS configuration
        run: |
          set -e

          flutter precache --ios

          flutter build ios \
            --config-only \
            --release \
            --no-codesign

          echo "✅ iOS configuration generated"

      # ==========================================
      # 9. Verify Swift Package integration
      # ==========================================
      - name: Verify Swift Package integration
        run: |
          set -e

          echo "=========================================="
          echo "Flutter iOS project"
          echo "=========================================="

          ls -la ios

          echo ""
          echo "=========================================="
          echo "Swift Package references"
          echo "=========================================="

          grep -R -i \
            "FlutterGeneratedPluginSwiftPackage" \
            ios/Runner.xcodeproj \
            ios/Runner.xcworkspace \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "Package.swift files"
          echo "=========================================="

          find ios \
            -name "Package.swift" \
            -o -name "*.swift" \
            | head -100 || true

          echo ""
          echo "=========================================="
          echo "Firebase plugin directories"
          echo "=========================================="

          # Firebase may NOT appear in ios/.symlinks when
          # Swift Package Manager is being used.
          if [ -d "ios/.symlinks/plugins" ]; then
            ls -la ios/.symlinks/plugins || true
          else
            echo "ℹ️ ios/.symlinks/plugins does not exist."
            echo "ℹ️ This is acceptable when SwiftPM is enabled."
          fi

      # ==========================================
      # 10. Check xcconfig
      # ==========================================
      - name: Check iOS xcconfig
        run: |
          echo "=========================================="
          echo "Release.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Release.xcconfig

          echo ""
          echo "=========================================="
          echo "Debug.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Debug.xcconfig || true

          echo ""
          echo "=========================================="
          echo "Profile.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Profile.xcconfig || true

      # ==========================================
      # 11. CocoaPods fallback dependencies
      # ==========================================
      - name: Install CocoaPods fallback dependencies
        run: |
          set -e

          cd ios

          echo "📦 Installing CocoaPods fallback dependencies..."

          pod install --repo-update

          echo ""
          echo "=========================================="
          echo "Pod installation result"
          echo "=========================================="

          if [ -f "Podfile.lock" ]; then
            cat Podfile.lock
          else
            echo "ℹ️ No Podfile.lock generated"
          fi

          cd ..

      # ==========================================
      # 12. Disable Code Signing
      # ==========================================
      - name: Disable Code Signing
        run: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          echo "🔧 Disabling automatic code signing..."

          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT"

          sed -i '' \
            's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            "$PROJECT"

          echo "✅ Code signing disabled"

      # ==========================================
      # 13. Build iOS
      # ==========================================
      - name: Build iOS
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

          echo "✅ Flutter iOS build completed"

      # ==========================================
      # 14. Verify Runner.app
      # ==========================================
      - name: Verify iOS app
        run: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"

          echo "=========================================="
          echo "Checking Runner.app"
          echo "=========================================="

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app not found"
            echo ""
            echo "Build directory:"
            find build/ios -maxdepth 4 -type d | head -100 || true
            exit 1
          fi

          echo "✅ Runner.app found"

          ls -lah "$APP_PATH"

      # ==========================================
      # 15. Create IPA
      # ==========================================
      - name: Create IPA
        working-directory: build/ios/iphoneos
        run: |
          set -e

          echo "=========================================="
          echo "Creating IPA"
          echo "=========================================="

          rm -rf Payload
          rm -f FlutterIpaExport.ipa

          mkdir -p Payload

          cp -R Runner.app Payload/Runner.app

          zip -qq -r -9 \
            FlutterIpaExport.ipa \
            Payload

          echo ""
          echo "=========================================="
          echo "IPA created"
          echo "=========================================="

          ls -lh FlutterIpaExport.ipa

      # ==========================================
      # 16. Upload IPA
      # ==========================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/FlutterIpaExport.ipa
          if-no-files-found: error