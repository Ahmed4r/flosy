name: Flutter iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter pub get
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build iOS for Simulator
        run: flutter build ios --simulator --release

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/ios/Release-iphonesimulator/Runner.app
