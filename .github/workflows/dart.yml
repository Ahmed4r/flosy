name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install Flutter
      # ==========================================
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      # ==========================================
      # 3. Flutter doctor
      # ==========================================
      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      # ==========================================
      # 4. Clean
      # ==========================================
      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================
      # 5. Get dependencies
      # ==========================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================
      # 6. Verify Firebase plugins
      # ==========================================
      - name: Verify Flutter iOS plugins
        run: |
          echo "=========================================="
          echo "Firebase in .flutter-plugins-dependencies"
          echo "=========================================="

          grep -i -C 2 \
            -E 'firebase_core|firebase_auth|cloud_firestore' \
            .flutter-plugins-dependencies || true

          echo ""
          echo "=========================================="
          echo "Removing stale iOS plugin links"
          echo "=========================================="

          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

      # ==========================================
      # 7. Generate Flutter iOS configuration
      # ==========================================
      - name: Generate Flutter iOS configuration
        run: |
          set -e

          flutter precache --ios

          flutter build ios \
            --config-only \
            --release \
            --no-codesign

      # ==========================================
      # 8. Verify iOS plugin symlinks
      # ==========================================
      - name: Verify iOS plugin symlinks
        run: |
          set -e

          echo "=========================================="
          echo "All iOS plugins"
          echo "=========================================="

          ls -la ios/.symlinks/plugins

          echo ""
          echo "=========================================="
          echo "Firebase plugins"
          echo "=========================================="

          for plugin in firebase_core firebase_auth cloud_firestore; do
            if [ -e "ios/.symlinks/plugins/$plugin" ]; then
              echo "✅ $plugin"
              ls -ld "ios/.symlinks/plugins/$plugin"
            else
              echo "❌ $plugin MISSING"
              exit 1
            fi
          done

      # ==========================================
      # 9. Check xcconfig
      # ==========================================
      - name: Check iOS xcconfig
        run: |
          echo "=========================================="
          echo "Release.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Release.xcconfig

          echo ""
          echo "=========================================="
          echo "Debug.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Debug.xcconfig || true

          echo ""
          echo "=========================================="
          echo "Profile.xcconfig"
          echo "=========================================="

          cat ios/Flutter/Profile.xcconfig || true

      # ==========================================
      # 10. CocoaPods
      # ==========================================
      - name: Clean and install CocoaPods
        run: |
          set -e

          cd ios

          echo "🧹 Removing old Pods..."
          rm -rf Pods

          echo "🧹 Removing old Podfile.lock..."
          rm -f Podfile.lock

          echo "🔧 Running pod deintegrate..."
          pod deintegrate || true

          echo "📦 Installing CocoaPods..."
          pod install --repo-update

          echo ""
          echo "=========================================="
          echo "Podfile.lock Firebase check"
          echo "=========================================="

          grep -i -E \
            "Firebase|Firestore|cloud_firestore|firebase_auth|firebase_core" \
            Podfile.lock || true

          echo ""

          if grep -qi "cloud_firestore" Podfile.lock; then
            echo "✅ cloud_firestore found"
          else
            echo "❌ cloud_firestore NOT found"
            exit 1
          fi

          if grep -qi "firebase_auth" Podfile.lock; then
            echo "✅ firebase_auth found"
          else
            echo "❌ firebase_auth NOT found"
            exit 1
          fi

          if grep -qi "firebase_core" Podfile.lock; then
            echo "✅ firebase_core found"
          else
            echo "❌ firebase_core NOT found"
            exit 1
          fi

          cd ..

      # ==========================================
      # 11. Disable Code Signing
      # ==========================================
      - name: Disable Code Signing
        run: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' \
            's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$PROJECT"

          sed -i '' \
            's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' \
            "$PROJECT"

          sed -i '' \
            's/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            "$PROJECT"

          echo "✅ Code signing disabled"

      # ==========================================
      # 12. Build Flutter iOS
      # ==========================================
      - name: Build iOS
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

      # ==========================================
      # 13. Create IPA
      # ==========================================
      - name: Create IPA
        working-directory: build/ios/iphoneos
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R Runner.app Payload/Runner.app

          zip -qq -r -9 \
            FlutterIpaExport.ipa \
            Payload

          echo "=========================================="
          echo "IPA created"
          echo "=========================================="

          ls -lh FlutterIpaExport.ipa

      # ==========================================
      # 14. Upload IPA
      # ==========================================
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/FlutterIpaExport.ipa