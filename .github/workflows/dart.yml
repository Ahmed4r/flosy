name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter pub get
        run: flutter pub get

      - name: Set iOS deployment target
        run: |
          cd ios
          if ! grep -q "platform :ios, '15.5'" Podfile; then
            echo "platform :ios, '15.5'" > Podfile.tmp
            cat Podfile >> Podfile.tmp
            mv Podfile.tmp Podfile
          fi
          cd ..

      - name: Clean and update CocoaPods
        run: |
          cd ios
          rm -f Podfile.lock
          pod repo update
          pod deintegrate
          pod install
          cd ..

      - name: Disable Code Signing in Xcode
        run: |
          cd ios
          ruby -i -pe 'gsub(/DEVELOPMENT_TEAM = .*;/, "DEVELOPMENT_TEAM = \"\";")' Runner.xcodeproj/project.pbxproj
          ruby -i -pe 'gsub(/CODE_SIGN_IDENTITY = .*;/, "CODE_SIGN_IDENTITY = \"\";")' Runner.xcodeproj/project.pbxproj
          ruby -i -pe 'gsub(/CODE_SIGN_STYLE = .*;/, "CODE_SIGN_STYLE = Manual;")' Runner.xcodeproj/project.pbxproj
          cd ..

      - name: Build iOS (simulator - no code signing needed)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
          ls -lh FlutterIpaExport.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/FlutterIpaExport.ipa
