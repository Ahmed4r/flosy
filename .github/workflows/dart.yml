name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Flutter pub get
        run: flutter pub get

      - name: Disable Code Signing FIRST (before any build)
        run: |
          # Change Automatic to Manual code signing for all targets
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          # Clear development team
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj
          # Remove code sign identity requirements
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Generate iOS configuration files
        run: flutter build ios --config-only

      - name: Update Podfile iOS version
        run: |
          cd ios
          if [ -f "Podfile" ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" Podfile
          fi

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Create IPA file
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r FlutterIpaExport.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/FlutterIpaExport.ipa